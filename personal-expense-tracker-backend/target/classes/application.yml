server:
  port: 8081

spring:
  application:
    name: personal-expense-tracker-backend
  datasource:
    url: jdbc:h2:mem:expenses;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false          # no lazy loading in the web layer; keeps layers honest
    hibernate:
      ddl-auto: create-drop      # Phase 1 only. Replaced by Flyway migrations in the PostgreSQL exercise.
    show-sql: false
  h2:
    console:
      enabled: true              # http://localhost:8081/h2-console (JDBC URL above, user sa, empty password)
